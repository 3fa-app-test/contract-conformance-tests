[package]
name = "ores-portfolio-inventory"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
default-run = "portfolio-inventory"

[[bin]]
name = "portfolio-inventory"
path = "src/main.rs"

[[bin]]
name = "portfolio-discover"
path = "src/bin/discover.rs"

[[bin]]
name = "portfolio-reconcile"
path = "src/bin/reconcile.rs"

[[bin]]
name = "portfolio-governance"
path = "src/bin/governance.rs"

[[bin]]
name = "portfolio-shards"
path = "src/bin/shards.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.151"

[lints.rust]
unsafe_code = "forbid"
