name: Auth factor peer-authority convergence

on:
  pull_request:
    paths:
      - 'contracts/auth-factor-policy/**'
      - '.github/workflows/peer-authority-convergence.yml'
  push:
    branches: [main]
    paths:
      - 'contracts/auth-factor-policy/**'
      - '.github/workflows/peer-authority-convergence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  peer-authority:
    uses: flags-2-env-test/contract-conformance-tests/.github/workflows/peer-authority-convergence.yml@2c8613f1405dd3c7b0b280a784c1c25516dcfc9e
    with:
      typespec_path: contracts/auth-factor-policy/main.tsp
      schema_path: contracts/auth-factor-policy/authored.schema.json
      instances_path: contracts/auth-factor-policy/instances
      expected_declarations_json: '["ThreeFaAuthFactorPolicy.AuthFactorPolicyV1"]'
