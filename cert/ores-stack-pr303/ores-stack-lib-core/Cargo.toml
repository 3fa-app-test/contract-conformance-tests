[package]
name = "ores-stack-lib-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Internal runtime contracts and validation for ORES Stack"
repository = "https://github.com/ores-stack/ores-stack-lib-core"

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
needless_return = "allow"
